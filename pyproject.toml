[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-foundation"
version = "0.2.0"
description = "Owner-controlled JARVIS foundation reference implementation"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography==50.0.1"]

[project.optional-dependencies]
s3 = ["boto3==1.43.85"]

[project.scripts]
jarvis = "jarvis.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
