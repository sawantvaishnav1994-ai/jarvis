name: J1 Development Checks

on:
  push:
    branches:
      - "validation/j1.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j1-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j1-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fast dependency install
        run: npm ci --ignore-scripts
      - name: J1.13 prettier diagnostic
        run: |
          npx prettier --write apps/web/app/conversation/conversation-console.tsx tests/unit/j1-remote-runtime-config.test.ts
          git diff -- apps/web/app/conversation/conversation-console.tsx tests/unit/j1-remote-runtime-config.test.ts
          exit 1
      - name: J1 development formatting
        run: >-
          npx prettier --check
          packages/core/src/tool-aware-conversation.ts
          packages/core/src/tool-aware-turn.ts
          packages/core/src/permission-approval-aware-conversation.ts
          packages/core/src/operating-modes.ts
          packages/core/src/streaming-resilience.ts
          packages/core/src/final-conversation-persistence.ts
          packages/core/src/final-conversation-storage.ts
          packages/identity/src/contracts.ts
          packages/storage/src/identity.ts
          packages/config/src/index.ts
          apps/api/src/conversation-http.ts
          apps/api/src/main.ts
          apps/web/app/page.tsx
          apps/web/app/globals.css
          apps/web/app/api/identity/route.ts
          apps/web/app/api/conversation/route.ts
          apps/web/app/conversation/page.tsx
          apps/web/app/conversation/conversation-console.tsx
          tests/unit/j1-tool-aware-conversation.test.ts
          tests/unit/j1-tool-aware-conversation-integration.test.ts
          tests/unit/j1-tool-aware-conversation-boundaries.test.ts
          tests/unit/j1-tool-aware-turn.test.ts
          tests/unit/j1-permission-approval-aware-conversation.test.ts
          tests/unit/j1-permission-approval-aware-conversation-integration.test.ts
          tests/unit/j1-operating-modes.test.ts
          tests/unit/j1-streaming-resilience.test.ts
          tests/unit/j1-conversational-web-ui.test.ts
          tests/unit/j1-final-integration-acceptance.test.ts
          tests/unit/j1-final-conversation-persistence.test.ts
          tests/unit/j1-final-conversation-storage.test.ts
          tests/unit/j1-remote-identity-session-storage.test.ts
          tests/unit/j1-remote-runtime-config.test.ts
          tests/security/j1-tool-aware-conversation-security.test.ts
          tests/security/j1-permission-approval-aware-conversation-security.test.ts
          tests/acceptance/j1.7-gates.json
          tests/acceptance/j1.8-gates.json
          tests/acceptance/j1.12-gates.json
          scripts/j1-tool-aware-conversation-go.mjs
          scripts/j1-permission-approval-aware-conversation-go.mjs
          scripts/j1-final-integration-go.mjs
          docs/roadmap/j1.7.md
          docs/roadmap/j1.8.md
          docs/roadmap/j1.9.md
          docs/roadmap/j1.10.md
          docs/roadmap/j1.11.md
          docs/roadmap/j1.12.md
          .github/workflows/j1.7-ci.yml
          .github/workflows/j1.8-ci.yml
          .github/workflows/j1.12-ci.yml
          .github/workflows/j1-dev-ci.yml
      - name: Package and API type build
        run: npm run build:packages
      - name: J1 Web typecheck
        run: npm run typecheck --workspace @jarvis/web
      - name: J1 focused lint
        run: >-
          npx eslint
          packages/core/src/tool-aware-conversation.ts
          packages/core/src/tool-aware-turn.ts
          packages/core/src/permission-approval-aware-conversation.ts
          packages/core/src/operating-modes.ts
          packages/core/src/streaming-resilience.ts
          packages/core/src/final-conversation-persistence.ts
          packages/core/src/final-conversation-storage.ts
          packages/identity/src/contracts.ts
          packages/storage/src/identity.ts
          packages/config/src/index.ts
          apps/api/src/conversation-http.ts
          apps/api/src/main.ts
          apps/web/app/page.tsx
          apps/web/app/api/identity/route.ts
          apps/web/app/api/conversation/route.ts
          apps/web/app/conversation/page.tsx
          apps/web/app/conversation/conversation-console.tsx
          tests/unit/j1-operating-modes.test.ts
          tests/unit/j1-streaming-resilience.test.ts
          tests/unit/j1-conversational-web-ui.test.ts
          tests/unit/j1-final-integration-acceptance.test.ts
          tests/unit/j1-final-conversation-persistence.test.ts
          tests/unit/j1-final-conversation-storage.test.ts
          tests/unit/j1-remote-identity-session-storage.test.ts
          tests/unit/j1-remote-runtime-config.test.ts
          tests/security/j1-tool-aware-conversation-security.test.ts
          tests/security/j1-permission-approval-aware-conversation-security.test.ts
          scripts/j1-tool-aware-conversation-go.mjs
          scripts/j1-permission-approval-aware-conversation-go.mjs
          scripts/j1-final-integration-go.mjs
      - name: Architecture boundary check
        run: node scripts/check-boundaries.mjs
      - name: Test contract typecheck
        run: npx tsc -p tsconfig.tests.json
      - name: J1 focused unit and security checks
        run: >-
          npx vitest run
          tests/unit/j11-acceptance.test.ts
          tests/unit/j1-tool-aware-conversation.test.ts
          tests/unit/j1-tool-aware-conversation-integration.test.ts
          tests/unit/j1-tool-aware-conversation-boundaries.test.ts
          tests/unit/j1-tool-aware-turn.test.ts
          tests/unit/j1-permission-approval-aware-conversation.test.ts
          tests/unit/j1-permission-approval-aware-conversation-integration.test.ts
          tests/unit/j1-operating-modes.test.ts
          tests/unit/j1-streaming-resilience.test.ts
          tests/unit/j1-conversational-web-ui.test.ts
          tests/unit/j1-final-integration-acceptance.test.ts
          tests/unit/j1-final-conversation-persistence.test.ts
          tests/unit/j1-final-conversation-storage.test.ts
          tests/unit/j1-remote-identity-session-storage.test.ts
          tests/unit/j1-remote-runtime-config.test.ts
          tests/security/j1-tool-aware-conversation-security.test.ts
          tests/security/j1-permission-approval-aware-conversation-security.test.ts
          tests/security/governed-gateway.test.ts
          tests/security/identity.test.ts
          tests/security/j1-model-orchestration-security.test.ts
          tests/security/j1-turn-pipeline-security.test.ts
          --reporter=default
