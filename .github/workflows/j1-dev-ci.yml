name: J1 Development Checks

on:
  push:
    branches:
      - "validation/j1.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j1-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j1-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fast dependency install
        run: npm ci --ignore-scripts
      - name: J1.11 formatter capture
        run: |
          npx prettier --write \
            packages/identity/src/contracts.ts \
            apps/api/src/conversation-http.ts \
            apps/web/app/page.tsx \
            apps/web/app/api/conversation/route.ts \
            apps/web/app/conversation/conversation-console.tsx \
            tests/unit/j1-conversational-web-ui.test.ts
          for file in \
            packages/identity/src/contracts.ts \
            apps/api/src/conversation-http.ts \
            apps/web/app/page.tsx \
            apps/web/app/api/conversation/route.ts \
            apps/web/app/conversation/conversation-console.tsx \
            tests/unit/j1-conversational-web-ui.test.ts; do
            echo "JARVIS_FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "JARVIS_FORMATTED_END:$file"
          done
          exit 1
