name: J1 Development Checks

on:
  push:
    branches:
      - "validation/j1.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j1-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j1-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fast dependency install
        run: npm ci --ignore-scripts
      - name: Static and contract checks
        run: npm run check
      - name: Critical inherited conversation security smoke
        run: >-
          npx vitest run
          tests/unit/j1-context-assembly.test.ts
          tests/security/j1-model-orchestration-security.test.ts
          tests/security/j1-turn-pipeline-security.test.ts
          tests/security/j1-conversation-history-security.test.ts
          tests/security/j1-memory-aware-conversation-security.test.ts
          --reporter=default
