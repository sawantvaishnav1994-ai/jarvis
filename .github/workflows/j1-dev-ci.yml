name: J1 Development Checks

on:
  push:
    branches:
      - "validation/j1.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: j1-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j1-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fast dependency install
        run: npm ci --ignore-scripts
      - name: J1.12 canonical formatter commit
        run: |
          npx prettier --write tests/unit/j1-final-integration-acceptance.test.ts
          if git diff --quiet -- tests/unit/j1-final-integration-acceptance.test.ts; then
            echo "Canonical formatting already committed."
            exit 0
          fi
          git config user.name "jarvis-ci"
          git config user.email "jarvis-ci@users.noreply.github.com"
          git add tests/unit/j1-final-integration-acceptance.test.ts
          git commit -m "style(j1.12): apply canonical test formatting"
          git push origin HEAD:validation/j1.9-j1.12-core-conversation-final-20260905
