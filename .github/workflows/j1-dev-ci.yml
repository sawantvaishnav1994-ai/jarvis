name: J1 Development Checks

on:
  push:
    branches:
      - "validation/j1.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j1-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j1-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fast dependency install
        run: npm ci --ignore-scripts
      - name: J1 development formatting
        run: >-
          npx prettier --check
          packages/core/src/tool-aware-conversation.ts
          packages/core/src/tool-aware-turn.ts
          tests/unit/j1-tool-aware-conversation.test.ts
          tests/unit/j1-tool-aware-conversation-integration.test.ts
          tests/unit/j1-tool-aware-conversation-boundaries.test.ts
          tests/unit/j1-tool-aware-turn.test.ts
          tests/security/j1-tool-aware-conversation-security.test.ts
          tests/acceptance/j1.7-gates.json
          scripts/j1-tool-aware-conversation-go.mjs
          docs/roadmap/j1.7.md
          .github/workflows/j1.7-ci.yml
      - name: Package type build
        run: npm run build:packages
      - name: Test contract typecheck
        run: npx tsc -p tsconfig.tests.json
      - name: J1.7 focused unit and security checks
        run: >-
          npx vitest run
          tests/unit/j1-tool-aware-conversation.test.ts
          tests/unit/j1-tool-aware-conversation-integration.test.ts
          tests/unit/j1-tool-aware-conversation-boundaries.test.ts
          tests/unit/j1-tool-aware-turn.test.ts
          tests/security/j1-tool-aware-conversation-security.test.ts
          tests/security/governed-gateway.test.ts
          tests/security/j1-model-orchestration-security.test.ts
          tests/security/j1-turn-pipeline-security.test.ts
          --reporter=default
