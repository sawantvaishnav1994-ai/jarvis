name: J1.3 provider health fix
on:
  push:
    branches:
      - validation/j1.3-model-orchestration-runtime-20260904
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run build:packages
      - name: Apply narrow provider-attempt normalization fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('packages/core/src/model-orchestration.ts')
          s = p.read_text()
          pattern = re.compile(r'const code = normalizeFailure\(\s*new ModelRoutingError\(\s*attempt\.code \?\? "MODEL_PROVIDER_ERROR",\s*attempt\.code \?\? "MODEL_PROVIDER_ERROR",\s*\),\s*\);')
          replacement = 'const code = normalizeFailure(\n                    new Error(attempt.code ?? "MODEL_PROVIDER_ERROR"),\n                );'
          updated, count = pattern.subn(replacement, s)
          if count != 1:
              raise SystemExit(f'expected provider-attempt normalization block exactly once, found {count}')
          p.write_text(updated)
          PY
          npx prettier --write packages/core/src/model-orchestration.ts
          npx prettier --check packages/core/src/model-orchestration.ts
          npm run build:packages
          npx vitest run tests/unit/j1-model-orchestration.test.ts tests/unit/j1-model-orchestration-integration.test.ts tests/security/j1-model-orchestration-security.test.ts --reporter=default
          git rm .github/workflows/j1.3-health-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/model-orchestration.ts
          git diff --cached --check
          git commit -m "fix(j1.3): attribute provider attempt failures to health"
          git push origin HEAD:validation/j1.3-model-orchestration-runtime-20260904
