name: J1 formatting probe
on:
  push:
    branches:
      - validation/j1.0-core-conversation-spec-20260904
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci --ignore-scripts
      - name: Print exact Prettier diff
        shell: bash
        run: |
          cp tests/unit/j1-core-acceptance.test.ts /tmp/j1-core-acceptance.before.ts
          cp scripts/j1-core-conversation-go.mjs /tmp/j1-core-conversation-go.before.mjs
          npx prettier --write tests/unit/j1-core-acceptance.test.ts scripts/j1-core-conversation-go.mjs
          diff -u /tmp/j1-core-acceptance.before.ts tests/unit/j1-core-acceptance.test.ts || true
          diff -u /tmp/j1-core-conversation-go.before.mjs scripts/j1-core-conversation-go.mjs || true
