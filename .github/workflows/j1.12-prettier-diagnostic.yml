name: J1.12 Prettier Diagnostic

on:
  push:
    branches:
      - validation/j1.9-j1.12-core-conversation-final-20260905

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact Prettier output
        run: |
          npx prettier --write scripts/j1-final-integration-go.mjs
          echo '--- PRETTIER DIFF ---'
          git diff -- scripts/j1-final-integration-go.mjs
          echo '--- PRETTIER FILE ---'
          cat scripts/j1-final-integration-go.mjs
