name: Foundation checks
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: python scripts/check.py
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m jarvis demo

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {NEXT_TELEMETRY_DISABLED: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .nvmrc, cache: npm}
      - name: Fast dependency install
        run: npm ci --ignore-scripts
      - name: J0.11 acceptance formatting
        shell: bash
        run: |
          npx prettier tests/acceptance/j11-gates.json > /tmp/j11-gates.formatted.json
          diff -u tests/acceptance/j11-gates.json /tmp/j11-gates.formatted.json
      - name: J0.12 Foundation v1 freeze formatting
        run: npx prettier --check foundation/*.json tests/acceptance/j12-gates.json tests/unit/j12-acceptance.test.ts scripts/j12-foundation-v1-go.mjs
      - name: J1.0 specification formatting
        run: npx prettier --check tests/acceptance/j1.0-gates.json tests/unit/j1-core-acceptance.test.ts scripts/j1-core-conversation-go.mjs
      - name: J1.1 runtime formatting
        run: npx prettier --check tests/acceptance/j1.1-gates.json tests/unit/j1-conversation-session.test.ts tests/integration/j1-conversation-session-postgres.test.ts packages/core/src/conversation-session.ts packages/storage/src/conversation-session-store.ts scripts/j1-conversation-session-go.mjs
      - name: J1.2 context formatting
        run: npx prettier --check tests/acceptance/j1.2-gates.json tests/unit/j1-context-assembly.test.ts packages/core/src/context-assembly.ts scripts/j1-context-assembly-go.mjs
      - name: J1.3 model orchestration formatting
        run: npx prettier --check tests/acceptance/j1.3-gates.json tests/unit/j1-model-orchestration.test.ts tests/unit/j1-model-orchestration-integration.test.ts tests/security/j1-model-orchestration-security.test.ts packages/core/src/model-orchestration.ts packages/models/src/j06-contracts.ts packages/models/src/router.ts packages/models/src/reference-adapter.ts scripts/j1-model-orchestration-go.mjs
      - name: J1.4 turn pipeline formatting
        run: npx prettier --check tests/acceptance/j1.4-gates.json tests/unit/j1-turn-pipeline.test.ts tests/unit/j1-turn-pipeline-integration.test.ts tests/integration/j1-turn-pipeline-postgres.test.ts tests/security/j1-turn-pipeline-security.test.ts packages/core/src/turn-pipeline.ts scripts/j1-turn-pipeline-go.mjs
      - name: J1.5 conversation history formatting
        run: npx prettier --check tests/acceptance/j1.5-gates.json tests/unit/j1-conversation-history.test.ts tests/integration/j1-conversation-history-postgres.test.ts tests/security/j1-conversation-history-security.test.ts packages/core/src/conversation-history.ts packages/storage/src/conversation-history-store.ts scripts/j1-conversation-history-go.mjs
      - name: J1.6 memory-aware conversation formatting
        run: npx prettier --check tests/acceptance/j1.6-gates.json tests/unit/j1-memory-aware-conversation.test.ts tests/security/j1-memory-aware-conversation-security.test.ts packages/core/src/memory-aware-conversation.ts scripts/j1-memory-aware-conversation-go.mjs docs/roadmap/j1.6.md
      - name: J1.7 tool-aware conversation formatting
        run: npx prettier --check tests/acceptance/j1.7-gates.json tests/unit/j1-tool-aware-conversation.test.ts tests/unit/j1-tool-aware-conversation-integration.test.ts tests/unit/j1-tool-aware-conversation-boundaries.test.ts tests/unit/j1-tool-aware-turn.test.ts tests/security/j1-tool-aware-conversation-security.test.ts packages/core/src/tool-aware-conversation.ts packages/core/src/tool-aware-turn.ts scripts/j1-tool-aware-conversation-go.mjs docs/roadmap/j1.7.md

  typescript-foundation:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {NEXT_TELEMETRY_DISABLED: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .nvmrc, cache: npm}
      - name: Fresh checkout setup
        run: npm run setup
      - name: J0.12 Foundation v1 freeze integrity
        run: npx vitest run tests/unit/j12-acceptance.test.ts --reporter=default
      - name: J1.0 specification integrity
        run: npx vitest run tests/unit/j1-core-acceptance.test.ts --reporter=default
      - name: J1.1 runtime integrity
        run: npx vitest run tests/unit/j1-conversation-session.test.ts --reporter=default
      - name: J1.2 context integrity
        run: npx vitest run tests/unit/j1-context-assembly.test.ts --reporter=default
      - name: J1.3 model orchestration integrity
        run: npx vitest run tests/unit/j1-model-orchestration.test.ts tests/unit/j1-model-orchestration-integration.test.ts tests/security/j1-model-orchestration-security.test.ts --reporter=default
      - name: J1.4 turn pipeline integrity
        run: npx vitest run tests/unit/j1-turn-pipeline.test.ts tests/unit/j1-turn-pipeline-integration.test.ts tests/security/j1-turn-pipeline-security.test.ts --reporter=default
      - name: J1.5 conversation history integrity
        run: npx vitest run tests/unit/j1-conversation-history.test.ts tests/security/j1-conversation-history-security.test.ts --reporter=default
      - name: J1.6 memory-aware conversation integrity
        run: npx vitest run tests/unit/j1-memory-aware-conversation.test.ts tests/security/j1-memory-aware-conversation-security.test.ts --reporter=default
      - name: J1.7 tool-aware conversation integrity
        run: npx vitest run tests/unit/j1-tool-aware-conversation.test.ts tests/unit/j1-tool-aware-conversation-integration.test.ts tests/unit/j1-tool-aware-conversation-boundaries.test.ts tests/unit/j1-tool-aware-turn.test.ts tests/security/j1-tool-aware-conversation-security.test.ts tests/security/governed-gateway.test.ts --reporter=default
      - name: Static and contract checks
        run: npm run check
      - name: Foundation and J1.7 critical security repeatability
        run: |
          for i in 1 2 3; do
            npx vitest run tests/security/governance.test.ts tests/security/governed-gateway.test.ts tests/security/identity.test.ts tests/security/j1-model-orchestration-security.test.ts tests/security/j1-turn-pipeline-security.test.ts tests/security/j1-conversation-history-security.test.ts tests/security/j1-memory-aware-conversation-security.test.ts tests/security/j1-tool-aware-conversation-security.test.ts tests/unit/j08-hardening.test.ts tests/unit/j10-hardening.test.ts tests/unit/j12-acceptance.test.ts tests/unit/j1-core-acceptance.test.ts tests/unit/j1-conversation-session.test.ts tests/unit/j1-context-assembly.test.ts tests/unit/j1-model-orchestration.test.ts tests/unit/j1-model-orchestration-integration.test.ts tests/unit/j1-turn-pipeline.test.ts tests/unit/j1-turn-pipeline-integration.test.ts tests/unit/j1-conversation-history.test.ts tests/unit/j1-memory-aware-conversation.test.ts tests/unit/j1-tool-aware-conversation.test.ts tests/unit/j1-tool-aware-conversation-integration.test.ts tests/unit/j1-tool-aware-conversation-boundaries.test.ts tests/unit/j1-tool-aware-turn.test.ts --reporter=default
          done
      - name: Real PostgreSQL integration
        run: npm run test:integration
      - name: Start API, worker and web
        run: |
          npm start > /tmp/jarvis-services.log 2>&1 &
          node scripts/wait-ready.mjs
      - name: Queue and health smoke
        run: npm run smoke
      - name: J0.8 Redis/BullMQ event transport
        run: node scripts/j08-queue-smoke.mjs
      - name: Browser installation
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npm run test:e2e
      - name: Owner identity and device trust GO flow
        env: {JARVIS_IDENTITY_E2E: '1'}
        run: npm run test:e2e:identity
      - name: J0.10 backup and recovery disaster drills
        run: npm run test:j10:recovery-drill
      - name: J0.12 Foundation v1 recovery and adversarial hardening
        run: |
          npm run test:j10:recovery-drill
          npx vitest run tests/unit/j10-hardening.test.ts --reporter=default
      - name: J1.7 replay concurrency and emergency regression
        run: npx vitest run tests/security/governance.test.ts tests/security/governed-gateway.test.ts tests/security/j1-model-orchestration-security.test.ts tests/security/j1-turn-pipeline-security.test.ts tests/security/j1-conversation-history-security.test.ts tests/security/j1-memory-aware-conversation-security.test.ts tests/security/j1-tool-aware-conversation-security.test.ts tests/unit/j08-hardening.test.ts tests/unit/j10-hardening.test.ts tests/unit/j1-conversation-session.test.ts tests/unit/j1-context-assembly.test.ts tests/unit/j1-model-orchestration.test.ts tests/unit/j1-model-orchestration-integration.test.ts tests/unit/j1-turn-pipeline.test.ts tests/unit/j1-turn-pipeline-integration.test.ts tests/unit/j1-conversation-history.test.ts tests/unit/j1-memory-aware-conversation.test.ts tests/unit/j1-tool-aware-conversation.test.ts tests/unit/j1-tool-aware-conversation-integration.test.ts tests/unit/j1-tool-aware-conversation-boundaries.test.ts tests/unit/j1-tool-aware-turn.test.ts --reporter=default
      - name: Dependency outage and recovery
        run: npm run test:failures
      - name: Stop and verify processes
        run: |
          npm stop
          node scripts/check-stopped.mjs
      - name: Safe service diagnostics
        if: failure()
        run: cat /tmp/jarvis-services.log 2>/dev/null || true
      - name: Explicit J0.4 A-S acceptance
        if: success()
        run: npm run test:j04:go
      - name: Explicit J0.5 A-T acceptance
        if: success()
        run: npm run test:j05:go
      - name: Explicit J0.6 A-T acceptance
        if: success()
        run: npm run test:j06:go
      - name: Explicit J0.7 A-T acceptance
        if: success()
        run: npm run test:j07:go
      - name: Explicit J0.8 A-T acceptance
        if: success()
        run: npm run test:j08:go
      - name: Explicit J0.9 A-T acceptance
        if: success()
        run: npm run test:j09:go
      - name: Explicit J0.10 A-T acceptance
        if: success()
        run: npm run test:j10:go
      - name: Explicit J0.11 A-T acceptance
        if: success()
        env: {J11_CI_SEQUENCE: 'complete'}
        run: npm run test:j11:go
      - name: Explicit J0.12 Foundation v1 A-T acceptance
        if: success()
        env: {J12_CI_SEQUENCE: 'complete'}
        run: npm run test:j12:go
      - name: Explicit J1.0 Core + Conversation A-T acceptance
        if: success()
        env: {J1_0_CI_SEQUENCE: 'complete'}
        run: npm run test:j1.0:go
      - name: Explicit J1.1 Conversation + Session A-T acceptance
        if: success()
        env: {J1_1_CI_SEQUENCE: 'complete'}
        run: npm run test:j1.1:go
      - name: Explicit J1.2 Context Assembly A-T acceptance
        if: success()
        env: {J1_2_CI_SEQUENCE: 'complete'}
        run: npm run test:j1.2:go
      - name: Explicit J1.3 Model Orchestration A-T acceptance
        if: success()
        env: {J1_3_CI_SEQUENCE: 'complete'}
        run: npm run test:j1.3:go
      - name: Explicit J1.4 Response Turn Pipeline A-T acceptance
        if: success()
        env: {J1_4_CI_SEQUENCE: 'complete'}
        run: npm run test:j1.4:go
      - name: Explicit J1.5 Conversation Persistence History A-T acceptance
        if: success()
        env: {J1_5_CI_SEQUENCE: 'complete'}
        run: npm run test:j1.5:go
      - name: Explicit J1.6 Memory-Aware Conversation A-T acceptance
        if: success()
        env: {J1_6_CI_SEQUENCE: 'complete'}
        run: npm run test:j1.6:go
      - name: Explicit J1.7 Tool-Aware Conversation A-T acceptance
        if: success()
        env: {J1_7_CI_SEQUENCE: 'complete'}
        run: npm run test:j1.7:go
      - name: Qualification failure summary
        if: failure()
        run: |
          echo "Candidate qualification stopped before complete acceptance attestation."
          echo "A skipped or unattested prior milestone in this run is not evidence that its previously validated baseline regressed."
          echo "Inspect the first failing required step for the actionable root cause."
      - name: Cleanup
        if: always()
        run: |
          npm stop || true
          npm run infra:down || true
