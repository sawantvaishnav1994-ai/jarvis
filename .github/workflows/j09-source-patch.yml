name: J0.9 source patch
on:
  push:
    branches:
      - validation/j0.9-audit-observability-20260903
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - run: node scripts/j09-update-legacy-migration-baseline.mjs
      - run: |
          if git diff --quiet -- tests/integration/private-data-postgres.test.ts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/integration/private-data-postgres.test.ts
          git commit -m "test(j0.9): advance private-data migration baseline"
          git push origin HEAD:${GITHUB_REF_NAME}
